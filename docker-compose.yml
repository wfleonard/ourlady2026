services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: primos_store
      POSTGRES_USER: primos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primos -d primos_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs-app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://primos:${POSTGRES_PASSWORD}@postgres:5432/primos_store
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
